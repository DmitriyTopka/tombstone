[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tombstone"
dynamic = ["version"]
description = "External circuit breaker for Kiro specs: prices tasks in credits, enforces caps, stops stuck agents."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tombstone = "tombstone.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tombstone.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tombstone = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
